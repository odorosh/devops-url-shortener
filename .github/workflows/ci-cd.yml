name: DevOps Portal CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: portal_db
          POSTGRES_USER: postgres       # Суперкористувач гарантує проходження міграцій
          POSTGRES_PASSWORD: my_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest flake8

    - name: Lint with flake8
      run: |
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Wait for PostgreSQL
      run: sleep 5

    - name: Run automated tests
      env:
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_NAME: portal_db
        DB_USER: postgres       # Тести йдуть через суперадміна з повними правами
        DB_PASSWORD: my_password
      run: |
        python -m pytest

  build-artifact:
    needs: test-and-validate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: production-portal-code
        path: |
          main.py
